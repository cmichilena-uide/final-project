<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecnoTienda | Registro</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="site_header"></header>
    <main class="auth_layout">
      <section class="auth_box">
        <h1>Crear cuenta</h1>
        <form id="register_form" class="form_card" novalidate>
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" autocomplete="name" required />
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" autocomplete="email" required />
          <label for="password">Contraseña (mínimo 8 caracteres)</label>
          <input type="password" id="password" autocomplete="new-password" required />
          <label for="confirm_password">Confirmar contraseña</label>
          <input type="password" id="confirm_password" autocomplete="new-password" required />
          <div class="form_actions">
            <button type="submit" id="submit_button">Crear cuenta</button>
          </div>
        </form>
        <p id="form_message" class="message" hidden></p>
        <p class="auth_switch">¿Ya tienes cuenta? <a id="switch_link" href="login.html">Inicia sesión</a></p>
      </section>
    </main>
    <footer id="site_footer"></footer>
    <script type="module" src="js/registro.js"></script>
  </body>
</html>
